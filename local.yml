services:
  redis_restart_test_app:
    container_name: redis_restart_test_app
    image: redis_restart_test:local
    init: true
    cpus: 1.0
    mem_limit: 256M
    memswap_limit: 256M
    restart: unless-stopped
  redis_restart_test_service:
    container_name: redis_restart_test_service
    image: redis:7.0.14
    cpus: 1.0
    mem_limit: 256M
    memswap_limit: 256M
